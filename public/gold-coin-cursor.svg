<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6B2" />
      <stop offset="25%" stop-color="#F5C518" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#664600" />
    </linearGradient>

    <!-- Face Gradient with Specular Light -->
    <radialGradient id="goldFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFEE5" />
      <stop offset="30%" stop-color="#FFDE43" />
      <stop offset="70%" stop-color="#E5B20D" />
      <stop offset="100%" stop-color="#996F00" />
    </radialGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Shadowed Base Coin -->
  <circle cx="16" cy="16" r="13.5" fill="url(#goldRim)" stroke="#4A3200" stroke-width="0.8" filter="url(#drop)" />

  <!-- Inner Coin Ridge -->
  <circle cx="16" cy="16" r="11.5" fill="url(#goldFace)" stroke="#FFEAA5" stroke-width="0.6" />

  <!-- Inner Milled Beaded Ring (dotted) -->
  <circle cx="16" cy="16" r="9.8" fill="none" stroke="#875F00" stroke-width="0.8" stroke-dasharray="1.4 1.4" opacity="0.75" />

  <!-- Center Star Emblem -->
  <path d="M16 9.5 L17.6 13.6 L22 14.1 L18.7 17 L19.6 21.4 L16 19.2 L12.4 21.4 L13.3 17 L10 14.1 L14.4 13.6 Z" fill="#FFF9D0" stroke="#9E7500" stroke-width="0.5" />

  <!-- Specular Crescent Glint -->
  <path d="M 6.5 14 A 10.5 10.5 0 0 1 18 5.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
</svg>
